    '工作里有一件事没做好，有点自责。',
    '睡得太晚，今天状态一般。',
    '有点焦虑，担心进度太慢。',
    '没忍住点了外卖，超出了今天的预算。',
  ];
  const dailyThink = [
    '与其焦虑六年，不如把今天该做的三件事做完。',
    '记录的意义不是完美，而是看见真实的自己。',
    '省钱的本质不是抠，而是把资源留给更重要的地方。',
    '训练最难的不是动作，是换鞋出门的那一下。',
    '每天进步 1%，一年后是 37 倍。',
  ];

  for (let i = 0; i < 75; i++) {
    const d = addDays(today, -74 + i);
    const day = parseD(d).getDay();
    if (![1, 3, 5, 6].includes(day) && Math.random() > 0.18) continue;
    if (Math.random() > 0.86) continue;
    const kind = pick(['strength', 'strength', 'cardio', 'hiit', 'ball', 'mind', 'outdoor']);
    let act, minutes, distance = '', hr = '', muscles = [], exercises = [];
    if (kind === 'strength') {
      act = 'strength';
      minutes = randInt(45, 75);
      muscles = Array.from(new Set([pick(MUSCLES), pick(MUSCLES), pick(MUSCLES)])).filter((m) => m !== '全身');
      const chosen = [];
      while (chosen.length < randInt(3, 4)) {
        const e = pick(exLib);
        if (!chosen.find((x) => x[0] === e[0])) chosen.push(e);
      }
      exercises = chosen.map(([name, lo, hi]) => ({
        name,
        sets: randInt(3, 4),
        reps: name === '平板支撑' ? randInt(30, 60) : randInt(8, 15),
        weight: hi ? Math.round(rnd(lo, hi) / 2.5) * 2.5 : 0,
      }));
    } else if (kind === 'cardio') {
      act = pick(['run', 'jog', 'cycle', 'swim', 'elliptical']);
      minutes = randInt(30, 55);
      const a = actById(act);
      if (a.dist) distance = (minutes / 60 * rnd(8, 11)).toFixed(1);
      hr = randInt(135, 165);
    } else if (kind === 'hiit') {
      act = pick(['hiit', 'rope', 'spin']);
      minutes = randInt(18, 32);
      hr = randInt(150, 178);
      muscles = ['全身'];
    } else if (kind === 'ball') {
      act = pick(['basketball', 'badminton', 'pingpong']);
      minutes = randInt(45, 90);
      hr = randInt(120, 155);
    } else if (kind === 'mind') {
      act = pick(['yoga', 'stretch', 'pilates']);
      minutes = randInt(20, 40);
      hr = randInt(80, 105);
    } else {
      act = 'hike';
      minutes = randInt(70, 150);
      distance = (minutes / 60 * rnd(3.2, 4.5)).toFixed(1);
    }
    const a = actById(act);
    const bodyweight = 73 - i * 0.02;
    fresh.workouts.push({
      id: uid(), date: d, type: a.type, activity: act, activityName: a.name, met: a.met,
      minutes, bodyweight: Math.round(bodyweight * 10) / 10, distance, hr,
      rpe: randInt(5, 9), muscles, exercises,
      kcal: Math.round((a.met * bodyweight * minutes) / 60),
      note: Math.random() < 0.22 ? pick(['状态不错，下次加重。', '今天有点累，但完成了。', '动作比上周稳定。', '出汗很多，补水。']) : '',
    });
  }

  for (let i = 0; i < 75; i++) {
    const d = addDays(today, -74 + i);
    if (Math.random() < 0.55) {
      const [subject, content] = pick(studyTopics);
      fresh.studies.push({
        id: uid(), date: d, subject, minutes: randInt(20, 90), content,
        note: Math.random() < 0.2 ? '明天继续同一主题。' : '',
      });
    }
    if (Math.random() < 0.42) {
      fresh.readings.push({
        id: uid(), date: d, book: pick(books), pages: randInt(8, 40),
        minutes: randInt(15, 60), note: '', finished: Math.random() < 0.06,
      });
    }
    if (Math.random() < 0.6) {
      fresh.daily.push({
        id: uid(), date: d,
        happy: Math.random() < 0.75 ? pick(dailyHappy) : '',
        sad: Math.random() < 0.5 ? pick(dailySad) : '',
        thought: pick(dailyThink),
      });
      fresh.weights.push({
        id: uid(), date: d,
        weight: Math.round((74.2 - i * 0.028 + rnd(-0.35, 0.35)) * 10) / 10,
        bodyFat: Math.round((19.8 - i * 0.018) * 10) / 10,
        waist: i % 15 === 0 ? Math.round((84 - i * 0.03) * 2) / 2 : '',
        chest: '', arm: '', thigh: '', hip: '',
      });
    }
    // water
    const cups = randInt(4, 9);
    for (let c = 0; c < cups; c++) {
      fresh.water.push({
        id: uid(), date: d, ml: pick([200, 250, 250, 300, 500]),
        time: pad2(randInt(7, 22)) + ':' + pad2(randInt(0, 59)),
      });
    }
    // meals
    const mealPlan = [
      ['breakfast', pick(['燕麦 + 鸡蛋', '全麦面包 + 牛奶', '豆浆 + 包子']), randInt(300, 480)],
      ['lunch', pick(['鸡腿饭', '牛肉面', '三明治', '公司食堂', '沙拉 + 鸡胸']), randInt(550, 850)],
      ['dinner', pick(['家常菜 + 米饭', '清炒时蔬 + 鱼', '火锅', '意面']), randInt(450, 900)],
    ];
    for (const [meal, name, kcal] of mealPlan) {
      if (Math.random() < 0.88) fresh.meals.push({ id: uid(), date: d, meal, name, kcal, note: '' });
    }
    if (Math.random() < 0.4) fresh.meals.push({ id: uid(), date: d, meal: 'snack', name: pick(['苹果', '酸奶', '坚果', '黑咖啡']), kcal: randInt(80, 260), note: '' });
  }

  const demoHabits = [
    { id: uid(), name: '早起', emoji: '🌅', createdAt: addDays(today, -74) },
    { id: uid(), name: '阅读 30 分钟', emoji: '📖', createdAt: addDays(today, -74) },
    { id: uid(), name: '不熬夜', emoji: '🌙', createdAt: addDays(today, -74) },
  ];
  fresh.habits = demoHabits;
  demoHabits.forEach((h, idx) => {
    const arr = [];
    for (let i = 0; i < 75; i++) {
      if (Math.random() < 0.66 + idx * 0.06) arr.push(addDays(today, -74 + i));
    }
    fresh.habitLogs[h.id] = arr;
  });

  for (const key of ['savings', 'expenses', 'workouts', 'studies', 'readings', 'daily', 'weights', 'meals', 'water']) {
    fresh[key].sort((a, b) => String(a.date).localeCompare(String(b.date)));
  }
  db = fresh;
  save();
  window.__expMonth = monthKey(today);
  window.__dietDate = today;
  render(true);
  toast('示例数据已载入，去各个页面看看吧');
}

function exportData() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `jack6-backup-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1200);
  toast('备份文件已导出');
}

function importFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(String(reader.result));
      if (!data || typeof data !== 'object' || !data.settings) throw new Error('bad');
      confirmDialog({
        title: '导入这份备份？',
        text: `文件：${esc(file.name)}<br>导入后会覆盖当前的全部记录。`,
        ok: '确认导入',
        danger: false,
        icon: 'upload',
        onConfirm() {
          localStorage.setItem(DB_KEY, JSON.stringify(data));
          db = loadDB();
          render(true);
          toast('备份已导入');
        },
      });
    } catch (e) {
      toast('这个文件不是有效的备份');
    }
  };
  reader.readAsText(file);
}

function clearAllData() {
  confirmDialog({
    title: '清空所有数据？',
    text: '所有记录都会被删除，且无法恢复。建议先导出备份。',
    ok: '全部清空',
    onConfirm() {
      const theme = db.settings.theme;
      db = defaultDB();
      db.settings.theme = theme;
      db.meta.seenWelcome = true;
      save();
      render(true);
      toast('数据已清空，可以重新开始了');
    },
  });
}

/* ================================================================
   EVENTS · INIT
   ================================================================ */
function toast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => el.classList.remove('show'), 2300);
}
function vibrate(ms = 8) {
  if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) { /* ignore */ } }
}
function showTip(text, el) {
  const tip = document.getElementById('tip');
  if (!tip || !el) return;
  tip.textContent = text;
  tip.hidden = false;
  const r = el.getBoundingClientRect();
  const x = clamp(r.left + r.width / 2, 60, window.innerWidth - 60);
  let y = r.top - 6;
  if (y < 50) y = r.bottom + 34;
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => { tip.hidden = true; }, 1900);
}

function toggleHabit(id, date = todayISO()) {
  if (!db.habitLogs[id]) db.habitLogs[id] = [];
  const arr = db.habitLogs[id];
  const on = arr.includes(date);
  db.habitLogs[id] = on ? arr.filter((d) => d !== date) : [...arr, date].sort();
  save();
  render();
  vibrate();
  if (!on) toast('已打卡 · 保持住');
}

function openAdd(kind) {
  if (sheetOpen) closeSheet();
  const map = {
    savings: () => sheetAddSavings(),
    expense: () => sheetAddExpense(),
    workout: () => sheetAddWorkout(),
    study: () => sheetAddStudy(),
    reading: () => sheetAddReading(),
    weight: () => sheetAddWeight(),
    meal: () => sheetAddMeal(currentRoute === 'diet' ? window.__dietDate : todayISO()),
    water: () => sheetAddWater(currentRoute === 'diet' ? window.__dietDate : todayISO()),
    habit: () => sheetAddHabit(),
  };
  (map[kind] || (() => toast('这个功能还在路上')))();
}

const DEL_LABELS = {
  savings: '这笔存款', expenses: '这笔消费', workouts: '这次训练', studies: '这条学习记录',
  readings: '这条阅读记录', weights: '这条体重记录', meals: '这条饮食记录', water: '这条饮水记录',
};

function handleDelete(kind, id) {
  if (kind === 'daily') {
    confirmDialog({
      title: '删除这一天的记录？', text: '删除后无法恢复。',
      onConfirm() {
        db.daily = db.daily.filter((d) => d.date !== id);
        save(); render(); toast('已删除');
      },
    });
    return;
  }
  if (kind === 'habits') {
    const h = db.habits.find((x) => x.id === id);
    if (!h) return;
    confirmDialog({
      title: `删除习惯「${esc(h.name)}」？`,
      text: '打卡记录也会一起删除。',
      onConfirm() {
        db.habits = db.habits.filter((x) => x.id !== id);
        delete db.habitLogs[id];
        save(); render(); toast('习惯已删除');
      },
    });
    return;
  }
  const rec = (db[kind] || []).find((r) => r.id === id);
  if (!rec) return;
  const extra = kind === 'savings' ? ` ${fmtMoney(rec.amount)}` : '';
  confirmDialog({
    title: `删除${DEL_LABELS[kind] || '这条记录'}？${extra}`,
    text: '删除后无法恢复。',
    onConfirm() {
      db[kind] = db[kind].filter((r) => r.id !== id);
      save(); render(); toast('已删除');
    },
  });
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) {
    const tipEl = e.target.closest('[data-tip]');
    if (tipEl) showTip(tipEl.dataset.tip, tipEl);
    return;
  }
  const act = el.dataset.act;
  switch (act) {
    case 'nav':
      closeSheet();
      go(el.dataset.route);
      break;
    case 'back':
      closeSheet();
      if (history.length > 1) history.back();
      else go('home');
      break;
    case 'theme':
      cycleTheme();
      break;
    case 'add':
      openAdd(el.dataset.kind);
      break;
    case 'del':
      handleDelete(el.dataset.kind, el.dataset.id);
      break;
    case 'toggle-habit':
      toggleHabit(el.dataset.id);
      break;
    case 'shift-month': {
      const cur = window.__expMonth || monthKey(todayISO());
      const next = shiftMonth(cur, Number(el.dataset.dir));
      window.__expMonth = next > monthKey(todayISO()) ? monthKey(todayISO()) : next;
      render();
      break;
    }
    case 'shift-diet': {
      const cur = window.__dietDate || todayISO();
      const next = addDays(cur, Number(el.dataset.dir));
      if (next <= todayISO()) { window.__dietDate = next; render(); }
      break;
    }
    case 'diet-today':
      window.__dietDate = todayISO();
      render();
      break;
    case 'water-quick': {
      const ml = Number(el.dataset.ml) || 250;
      const d = el.dataset.date || todayISO();
      const now = new Date();
      db.water.push({ id: uid(), date: d, ml, time: pad2(now.getHours()) + ':' + pad2(now.getMinutes()) });
      save(); render(); vibrate();
      toast(`已记录 ${ml} ml`);
      break;
    }
    case 'open-settings':
      sheetSettings();
      break;
    case 'set-theme':
      db.settings.theme = el.dataset.theme;
      save(); applyTheme(); render();
      break;
    case 'export':
      exportData();
      break;
    case 'import':
      document.getElementById('import-file').click();
      break;
    case 'import-watch':
      sheetImportWatch();
      break;
    case 'import-wechat':
      sheetImportWechat();
      break;
    case 'load-demo': {
      const has = db.savings.length || db.expenses.length || db.workouts.length || db.studies.length || db.readings.length || db.daily.length;
      if (!has) loadDemo();
      else confirmDialog({
        title: '载入示例数据？',
        text: '当前的记录会被覆盖。建议先导出备份。',
        ok: '载入示例', danger: false, icon: 'spark',
        onConfirm: loadDemo,
      });
      break;
    }
    case 'clear-all':
      clearAllData();
      break;
    case 'quick-habit': {
      const name = el.dataset.name;
      const emoji = el.dataset.emoji;
      if (!name) break;
      const id = uid();
      db.habits.push({ id, name, emoji, createdAt: todayISO() });
      db.habitLogs[id] = [];
      save(); render();
      toast(`已建立习惯：${name}`);
      break;
    }
    default:
      break;
  }
});

document.addEventListener('change', (e) => {
  if (e.target && e.target.id === 'import-file') {
    const f = e.target.files && e.target.files[0];
    if (f) importFile(f);
    e.target.value = '';
  }
});

document.addEventListener('submit', (e) => {
  const form = e.target.closest('[data-form="daily"]');
  if (!form) return;
  e.preventDefault();
  const data = new FormData(form);
  const happy = textVal(data, 'happy');
  const sad = textVal(data, 'sad');
  const thought = textVal(data, 'thought');
  if (!happy && !sad && !thought) { toast('至少写下一件事'); return; }
  const date = todayISO();
  const existing = db.daily.find((d) => d.date === date);
  if (existing) Object.assign(existing, { happy, sad, thought });
  else db.daily.push({ id: uid(), date, happy, sad, thought });
  save();
  render();
  toast('今天的记录已保存');
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeSheet();
});

window.addEventListener('hashchange', () => render());

window.addEventListener('scroll', () => {
  const bar = document.getElementById('topbar');
  if (bar) bar.classList.toggle('scrolled', window.scrollY > 6);
}, { passive: true });

if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onChange = () => {
    if ((db.settings.theme || 'auto') === 'auto') { applyTheme(); render(); }
  };
  if (mq.addEventListener) mq.addEventListener('change', onChange);
  else if (mq.addListener) mq.addListener(onChange);
}

function init() {
  applyTheme();
  if (!location.hash) history.replaceState(null, '', '#/home');
  render();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
}

init();

</script>
</body>
</html>
