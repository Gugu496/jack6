/* ============================================================
   六年之约 · Jack — mobile PWA
   Warm paper + gold. Light & dark are each selected, not flipped.
   ============================================================ */

:root {
  color-scheme: light;
  --bg: #f3eee3;
  --bg-2: #ece5d6;
  --card: #fffcf6;
  --card-2: #f8f3e7;
  --ink: #1b1915;
  --ink-2: #585146;
  --muted: #8b8271;
  --line: #e7dfcf;
  --line-2: #d9cfbb;
  --gold: #b8862b;
  --gold-2: #d5a845;
  --gold-ink: #80571a;
  --gold-soft: #f4e6c4;
  --gold-wash: #fbf4e2;
  --gold-grad: linear-gradient(135deg, #d9a845 0%, #b8862b 100%);
  --good: #006300;
  --good-wash: #e8f2e6;
  --critical: #b5483e;
  --critical-wash: #f8e9e6;
  --info: #2a78d6;
  --shadow: 0 1px 2px rgba(48, 38, 18, .04), 0 10px 28px -16px rgba(48, 38, 18, .22);
  --shadow-sm: 0 1px 2px rgba(48, 38, 18, .05);
  --hero-bg: linear-gradient(155deg, #26221b 0%, #171511 62%, #12100d 100%);
  --hero-ink: #f6efdf;
  --hero-muted: #b7a98a;
  --track: rgba(255, 255, 255, .13);
  --chart-grid: #e7dfcf;
  --chart-axis: #b9ae98;
  --tooltip-bg: #1b1915;
  --tooltip-ink: #fffcf6;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --series-6: #008300;
  --series-7: #6250d6;
  --series-8: #e34948;
  --series-other: #8b8271;
  --radius: 20px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e0d0c;
  --bg-2: #151412;
  --card: #181613;
  --card-2: #201d19;
  --ink: #f4efe5;
  --ink-2: #c7bfb0;
  --muted: #948b7b;
  --line: #2b2722;
  --line-2: #3a352e;
  --gold: #d9a441;
  --gold-2: #e9be63;
  --gold-ink: #e9be63;
  --gold-soft: #3a2d14;
  --gold-wash: #241d10;
  --good: #4caf50;
  --good-wash: #17271a;
  --critical: #e66767;
  --critical-wash: #2b1716;
  --info: #3987e5;
  --shadow: 0 1px 0 rgba(255, 255, 255, .03), 0 18px 40px -24px rgba(0, 0, 0, .8);
  --shadow-sm: 0 1px 0 rgba(255, 255, 255, .03);
  --hero-bg: linear-gradient(155deg, #262119 0%, #191612 60%, #12100d 100%);
  --hero-ink: #f6efdf;
  --hero-muted: #b7a98a;
  --track: rgba(255, 255, 255, .13);
  --chart-grid: #2b2722;
  --chart-axis: #6f675a;
  --tooltip-bg: #f4efe5;
  --tooltip-ink: #171410;
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --series-5: #d55181;
  --series-6: #008300;
  --series-7: #9085e9;
  --series-8: #e66767;
  --series-other: #948b7b;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, h4, p { margin: 0; }
svg { display: block; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ---------- shell ---------- */
#phone {
  max-width: 480px;
  min-height: 100dvh;
  margin: 0 auto;
  position: relative;
  background: var(--bg);
}
@media (min-width: 560px) {
  body { background: var(--bg-2); }
  #phone {
    box-shadow: 0 0 0 1px var(--line), 0 30px 80px -40px rgba(30, 24, 12, .35);
  }
}
.view {
  padding: 4px 16px calc(96px + var(--safe-b));
  outline: none;
  animation: fadein .22s ease;
}
@keyframes fadein { from { opacity: .35; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .view { animation: none; }
  * { scroll-behavior: auto !important; }
}

/* ---------- top bar ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  padding: calc(10px + var(--safe-t)) 16px 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: saturate(140%) blur(14px);
  backdrop-filter: saturate(140%) blur(14px);
  border-bottom: 1px solid transparent;
  transition: border-color .2s;
}
.topbar.scrolled { border-bottom-color: var(--line); }
.tb-back {
  width: 34px; height: 34px; margin-left: -6px;
  display: grid; place-items: center;
  border-radius: 12px; color: var(--ink-2);
}
.tb-back:active { background: var(--card-2); }
.tb-title { flex: 1; min-width: 0; }
.tb-title h1 { font-size: 17px; font-weight: 650; letter-spacing: -.2px; line-height: 1.25; }
.tb-title p { font-size: 11px; color: var(--muted); letter-spacing: .02em; margin-top: 1px; }
.tb-mark {
  width: 30px; height: 30px; border-radius: 10px;
  background: #1b1915; display: grid; place-items: center;
  box-shadow: inset 0 0 0 1px rgba(217, 164, 65, .3);
}
.tb-mark svg { width: 20px; height: 20px; }
.tb-actions { display: flex; gap: 4px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 12px;
  display: grid; place-items: center; color: var(--ink-2);
  transition: background .15s, color .15s;
}
.icon-btn:active { background: var(--card-2); color: var(--ink); }
.icon-btn.accent { color: var(--gold-ink); }

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed;
  z-index: 50;
  left: 50%; bottom: 0;
  transform: translateX(-50%);
  width: 100%; max-width: 480px;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding: 6px 8px calc(6px + var(--safe-b));
  background: color-mix(in srgb, var(--card) 88%, transparent);
  -webkit-backdrop-filter: saturate(150%) blur(18px);
  backdrop-filter: saturate(150%) blur(18px);
  border-top: 1px solid var(--line);
}
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 5px 0 4px; border-radius: 14px;
  color: var(--muted);
  font-size: 10px; letter-spacing: .02em;
  transition: color .15s;
}
.tab svg { width: 23px; height: 23px; }
.tab.active { color: var(--gold-ink); font-weight: 600; }
.tab:active { background: var(--gold-wash); }

/* ---------- page heads ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 10px 2px 14px; }
.page-head h2 { font-size: 24px; font-weight: 680; letter-spacing: -.6px; }
.page-head p { font-size: 12px; color: var(--muted); margin-top: 3px; }
.head-action { font-size: 13px; color: var(--gold-ink); font-weight: 600; white-space: nowrap; padding: 6px 0 2px; }

/* ---------- cards ---------- */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}
.card-pad { padding: 16px; }
.section { margin-top: 20px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 2px 10px; }
.section-head h3 { font-size: 15px; font-weight: 650; letter-spacing: -.1px; }
.section-head .sub { font-size: 11px; color: var(--muted); }
.link { font-size: 12px; color: var(--gold-ink); font-weight: 600; display: inline-flex; align-items: center; gap: 2px; }
.link svg { width: 14px; height: 14px; }

/* ---------- hero ---------- */
.hero {
  position: relative;
  overflow: hidden;
  border-radius: 26px;
  padding: 22px 22px 20px;
  background: var(--hero-bg);
  color: var(--hero-ink);
  box-shadow: 0 18px 40px -26px rgba(20, 15, 5, .7);
}
.hero::before {
  content: "";
  position: absolute; right: -70px; top: -90px;
  width: 260px; height: 260px; border-radius: 50%;
  background: radial-gradient(circle, rgba(217, 164, 65, .28), transparent 68%);
  pointer-events: none;
}
.hero::after {
  content: "";
  position: absolute; left: -40px; bottom: -100px;
  width: 200px; height: 200px; border-radius: 50%;
  background: radial-gradient(circle, rgba(217, 164, 65, .10), transparent 70%);
  pointer-events: none;
}
.hero > * { position: relative; z-index: 1; }
.hero-eyebrow {
  display: flex; align-items: center; gap: 8px;
  font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--hero-muted); font-weight: 600;
}
.hero-eyebrow .spark { width: 14px; height: 14px; color: var(--gold-2); }
.hero-big-row { display: flex; align-items: baseline; gap: 8px; margin: 10px 0 2px; }
.hero-big { font-size: 54px; font-weight: 620; letter-spacing: -2.5px; line-height: 1; font-variant-numeric: normal; }
.hero-big.sm { font-size: 40px; letter-spacing: -1.5px; }
.hero-unit { font-size: 14px; color: var(--hero-muted); font-weight: 500; }
.hero-caption { font-size: 12px; color: var(--hero-muted); }
.hero-meter { margin-top: 18px; }
.hero-meter .meter-track { background: var(--track); }
.hero-meter .meter-fill { background: var(--gold-grad); }
.hero-meter-labels { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--hero-muted); margin-top: 7px; }
.hero-divider { height: 1px; background: rgba(255, 255, 255, .1); margin: 16px 0 14px; }
.hero-row { display: flex; align-items: center; gap: 12px; }
.hero-row .grow { flex: 1; min-width: 0; }
.hero-k { font-size: 10.5px; letter-spacing: .06em; color: var(--hero-muted); }
.hero-v { font-size: 18px; font-weight: 620; margin-top: 2px; letter-spacing: -.3px; }
.hero-v small { font-size: 11px; color: var(--hero-muted); font-weight: 500; margin-left: 3px; letter-spacing: 0; }
.hero-chip {
  font-size: 10.5px; padding: 5px 9px; border-radius: 99px;
  background: rgba(217, 164, 65, .16); color: var(--gold-2);
  border: 1px solid rgba(217, 164, 65, .24); white-space: nowrap;
}
.hero-pillars { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.hero-pillar { font-size: 10px; color: var(--hero-muted); border: 1px solid rgba(255,255,255,.13); padding: 3px 8px; border-radius: 99px; }

/* ---------- meters / rings ---------- */
.meter-track {
  height: 8px; border-radius: 99px; background: var(--card-2);
  overflow: hidden; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--line) 55%, transparent);
}
.meter-fill { height: 100%; border-radius: 99px; background: var(--gold-grad); transition: width .5s cubic-bezier(.2,.8,.2,1); }
.meter-fill.good { background: linear-gradient(90deg, #4d7a3f, #5f8f4c); }
.meter-fill.critical { background: linear-gradient(90deg, #c06a5d, #b5483e); }
.meter-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 7px; }
.ring {
  --p: 0;
  width: 122px; height: 122px; border-radius: 50%;
  background: conic-gradient(var(--ring-color, var(--gold)) calc(var(--p) * 1%), var(--card-2) 0);
  display: grid; place-items: center; position: relative;
  box-shadow: inset 0 0 0 1px var(--line);
}
.ring::after {
  content: ""; position: absolute; inset: 11px; border-radius: 50%;
  background: var(--card);
  box-shadow: inset 0 0 0 1px var(--line);
}
.ring-inner { position: relative; z-index: 1; text-align: center; }
.ring-inner b { display: block; font-size: 23px; font-weight: 650; letter-spacing: -.8px; }
.ring-inner span { font-size: 10px; color: var(--muted); }
.ring.sm { width: 82px; height: 82px; }
.ring.sm::after { inset: 8px; }
.ring.sm .ring-inner b { font-size: 16px; }

/* ---------- stat tiles ---------- */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat-grid.t4 { grid-template-columns: 1fr 1fr; }
.stat-grid.g5 { grid-template-columns: repeat(2, 1fr); }
.stat {
  background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  padding: 13px 14px 12px; box-shadow: var(--shadow-sm);
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.stat-label { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.stat-label svg { width: 13px; height: 13px; color: var(--gold); }
.stat-value { font-size: 22px; font-weight: 650; letter-spacing: -.6px; line-height: 1.25; }
.stat-value small { font-size: 11px; font-weight: 500; color: var(--muted); margin-left: 2px; letter-spacing: 0; }
.stat-foot { font-size: 10.5px; color: var(--muted); }
.stat-foot.up { color: var(--good); }
.stat-foot.down { color: var(--critical); }
.stat.tint { background: var(--gold-wash); border-color: color-mix(in srgb, var(--gold) 22%, var(--line)); }
.stat.tint .stat-value { color: var(--gold-ink); }

/* ---------- quick actions ---------- */
.quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.quick { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 8px 2px; border-radius: 16px; color: var(--ink-2); }
.quick:active { background: var(--card-2); }
.quick-ic {
  width: 46px; height: 46px; border-radius: 16px;
  background: var(--card); border: 1px solid var(--line);
  display: grid; place-items: center; color: var(--gold-ink);
  box-shadow: var(--shadow-sm);
}
.quick-ic svg { width: 21px; height: 21px; }
.quick span { font-size: 10.5px; }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column; }
.list > * + * { border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: none; text-align: left; width: 100%; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-size: 14px; font-weight: 560; display: flex; align-items: center; gap: 7px; }
.row-sub { font-size: 11px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-amt { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row-amt.in { color: var(--good); }
.row-amt.out { color: var(--ink); }
.row-side { font-size: 11px; color: var(--muted); white-space: nowrap; text-align: right; }
.row-ic {
  width: 38px; height: 38px; border-radius: 12px; flex: none;
  display: grid; place-items: center;
  background: var(--card-2); color: var(--ink-2);
  font-size: 17px;
}
.row-ic.gold { background: var(--gold-wash); color: var(--gold-ink); }
.row-del {
  width: 30px; height: 30px; flex: none; border-radius: 9px;
  display: grid; place-items: center; color: var(--muted); opacity: .65;
}
.row-del:active { background: var(--critical-wash); color: var(--critical); }
.row-del svg { width: 15px; height: 15px; }
.row-chev { color: var(--muted); width: 16px; height: 16px; flex: none; }
.row-actions { display: flex; align-items: center; gap: 2px; }
.date-group-title {
  font-size: 11px; color: var(--muted); letter-spacing: .04em;
  padding: 14px 2px 6px; font-weight: 600;
}
.day-total { float: right; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- empty ---------- */
.empty { text-align: center; padding: 34px 20px 30px; color: var(--muted); }
.empty-ic {
  width: 54px; height: 54px; margin: 0 auto 12px; border-radius: 18px;
  background: var(--gold-wash); color: var(--gold); display: grid; place-items: center;
}
.empty-ic svg { width: 25px; height: 25px; }
.empty b { display: block; color: var(--ink-2); font-size: 14px; font-weight: 600; margin-bottom: 3px; }
.empty p { font-size: 12px; line-height: 1.6; }
.empty .btn { margin-top: 14px; }
.empty.sm { padding: 22px 16px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 42px; padding: 0 18px; border-radius: 14px;
  font-size: 14px; font-weight: 600; letter-spacing: .01em;
  background: var(--card-2); color: var(--ink);
  border: 1px solid var(--line);
  transition: transform .1s, filter .15s;
}
.btn:active { transform: scale(.985); }
.btn svg { width: 17px; height: 17px; }
.btn-primary {
  background: var(--gold-grad); color: #241806; border-color: transparent;
  box-shadow: 0 8px 20px -12px rgba(160, 115, 30, .8);
}
.btn-primary:active { filter: brightness(.97); }
.btn-ghost { background: transparent; border-color: var(--line-2); color: var(--ink-2); }
.btn-danger { background: var(--critical-wash); color: var(--critical); border-color: color-mix(in srgb, var(--critical) 20%, var(--line)); }
.btn-block { width: 100%; }
.btn-sm { min-height: 34px; padding: 0 13px; font-size: 12.5px; border-radius: 11px; }
.btn-row { display: flex; gap: 10px; }
.btn-row > * { flex: 1; }
.btn-quiet { background: none; border: 0; color: var(--muted); font-size: 12px; padding: 6px; }

/* ---------- segmented ---------- */
.seg {
  display: flex; gap: 3px; padding: 4px;
  background: var(--card-2); border: 1px solid var(--line);
  border-radius: 14px;
}
.seg button {
  flex: 1; min-height: 34px; border-radius: 10px;
  font-size: 13px; color: var(--muted); font-weight: 550;
  transition: background .15s, color .15s, box-shadow .15s;
}
.seg button.on {
  background: var(--card); color: var(--ink); font-weight: 650;
  box-shadow: 0 1px 3px rgba(40, 30, 10, .12);
}
.seg.gold button.on { background: var(--gold-grad); color: #241806; box-shadow: none; }
.seg.tabs { background: transparent; border: 0; padding: 0 0 2px; gap: 18px; border-radius: 0; border-bottom: 1px solid var(--line); }
.seg.tabs button { flex: none; min-height: 36px; padding: 0 2px; border-radius: 0; position: relative; font-size: 14px; }
.seg.tabs button.on { background: none; box-shadow: none; color: var(--ink); }
.seg.tabs button.on::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
  background: var(--gold); border-radius: 2px;
}

/* ---------- chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  position: relative; display: inline-flex; align-items: center; gap: 5px;
  min-height: 34px; padding: 0 12px; border-radius: 99px;
  border: 1px solid var(--line); background: var(--card-2);
  font-size: 12.5px; color: var(--ink-2); user-select: none;
  transition: border-color .15s, background .15s, color .15s;
}
.chip input { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }
.chip:has(input:checked), .chip.on {
  background: var(--gold-wash); border-color: var(--gold);
  color: var(--gold-ink); font-weight: 600;
}
.chip:active { transform: scale(.98); }
.chip .swatch { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .8; }
.chip.mini { min-height: 28px; padding: 0 10px; font-size: 11.5px; }

.tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10.5px; padding: 2px 7px; border-radius: 6px;
  background: var(--card-2); color: var(--muted); white-space: nowrap;
}
.tag.gold { background: var(--gold-wash); color: var(--gold-ink); }
.tag.good { background: var(--good-wash); color: var(--good); }
.tag.critical { background: var(--critical-wash); color: var(--critical); }

/* ---------- forms ---------- */
.field { margin-bottom: 14px; }
.field > label, .field-label { display: block; font-size: 12px; color: var(--ink-2); font-weight: 600; margin-bottom: 6px; letter-spacing: .01em; }
.field .hint { font-size: 11px; color: var(--muted); margin-top: 5px; line-height: 1.5; }
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.input {
  width: 100%; min-height: 44px; padding: 10px 12px;
  background: var(--card-2); border: 1px solid var(--line);
  border-radius: 12px; color: var(--ink); font-size: 16px;
  transition: border-color .15s, box-shadow .15s;
  appearance: none;
}
textarea.input { min-height: 84px; resize: vertical; line-height: 1.6; font-size: 15px; }
.input::placeholder { color: var(--muted); opacity: .7; }
.input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 16%, transparent); }
select.input {
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 16px) 19px, calc(100% - 11px) 19px;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  padding-right: 32px;
}
input[type="date"].input { min-height: 44px; }
input[type="range"] { width: 100%; accent-color: var(--gold); }
.range-row { display: flex; align-items: center; gap: 12px; }
.range-row output { min-width: 34px; text-align: right; font-weight: 650; color: var(--gold-ink); font-variant-numeric: tabular-nums; }
.money-input { position: relative; }
.money-input .cur { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; }
.money-input .input { padding-left: 30px; font-size: 20px; font-weight: 620; letter-spacing: -.3px; }
.form-note { font-size: 11px; color: var(--muted); line-height: 1.6; margin-top: 2px; }
.watch-steps { margin: 8px 0 0; padding-left: 18px; font-size: 12px; color: var(--muted); line-height: 1.85; }
.watch-steps li + li { margin-top: 2px; }
.watch-steps b { color: var(--ink); font-weight: 560; }

/* exercise rows */
.ex-list { display: flex; flex-direction: column; gap: 8px; }
.ex-row { display: grid; grid-template-columns: 1.5fr .62fr .62fr .8fr 28px; gap: 6px; align-items: center; }
.ex-row .input { min-height: 40px; padding: 7px 8px; font-size: 14px; text-align: center; }
.ex-row .input.ex-name { text-align: left; font-size: 13px; }
.ex-row .row-del { width: 26px; height: 34px; }
.ex-head { display: grid; grid-template-columns: 1.5fr .62fr .62fr .8fr 28px; gap: 6px; font-size: 10px; color: var(--muted); padding: 0 2px 4px; text-align: center; }
.ex-head span:first-child, .ex-head span:last-child { text-align: left; }
.ex-add { margin-top: 9px; }
.calc-note {
  display: flex; align-items: center; gap: 8px;
  background: var(--gold-wash); border: 1px solid color-mix(in srgb, var(--gold) 24%, var(--line));
  color: var(--gold-ink); border-radius: 12px; padding: 10px 12px;
  font-size: 12px; line-height: 1.5;
}
.calc-note b { font-variant-numeric: tabular-nums; }

/* ---------- charts ---------- */
.chart-card { padding: 16px 12px 12px; }
.chart-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 4px 8px; }
.chart-head .t { font-size: 13px; font-weight: 650; }
.chart-head .s { font-size: 10.5px; color: var(--muted); }
.chart { width: 100%; height: auto; overflow: visible; }
.chart text { font-family: inherit; }
.chart .grid { stroke: var(--chart-grid); stroke-width: 1; }
.chart .axis-label { fill: var(--chart-axis); font-size: 9.5px; }
.chart .bar { transition: opacity .15s; }
.chart .bar-hit { fill: transparent; cursor: pointer; }
.chart .bar-hit:active { fill: color-mix(in srgb, var(--gold) 8%, transparent); }
.chart .value-label { fill: var(--ink-2); font-size: 10px; font-weight: 600; }
.chart .line-path { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .end-label { fill: var(--ink); font-size: 10.5px; font-weight: 650; }
.chart .dot { stroke: var(--card); stroke-width: 2; }
.chart .empty-chart { fill: var(--muted); font-size: 11px; }
.chart-table-toggle { font-size: 10.5px; color: var(--muted); }

.legend { display: flex; flex-direction: column; gap: 9px; }
.legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.legend-dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.legend-name { flex: 1; min-width: 0; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend-val { color: var(--muted); font-variant-numeric: tabular-nums; }
.legend-pct { width: 38px; text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; font-weight: 600; }
.donut-wrap { display: flex; align-items: center; gap: 16px; }
.donut-wrap .legend { flex: 1; }
.donut-holder { position: relative; flex: none; }
.donut-center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.donut-center b { display: block; font-size: 17px; font-weight: 650; letter-spacing: -.4px; }
.donut-center span { font-size: 10px; color: var(--muted); }

/* heatmap */
.heatmap { display: flex; gap: 3px; overflow-x: auto; padding: 2px 0 4px; scrollbar-width: none; }
.heatmap::-webkit-scrollbar { display: none; }
.hm-week { display: flex; flex-direction: column; gap: 3px; flex: none; }
.hm-cell { width: 11px; height: 11px; border-radius: 3px; background: var(--card-2); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--line) 60%, transparent); }
.hm-cell.l1 { background: color-mix(in srgb, var(--gold) 22%, var(--card)); }
.hm-cell.l2 { background: color-mix(in srgb, var(--gold) 45%, var(--card)); }
.hm-cell.l3 { background: color-mix(in srgb, var(--gold) 70%, var(--card)); }
.hm-cell.l4 { background: var(--gold); }
.hm-cell.future { opacity: 0; }
.hm-legend { display: flex; align-items: center; gap: 5px; justify-content: flex-end; font-size: 10px; color: var(--muted); margin-top: 5px; }
.hm-legend .hm-cell { width: 9px; height: 9px; }
.hm-days { display: flex; flex-direction: column; gap: 3px; margin-right: 2px; padding-top: 0; }
.hm-days span { height: 11px; font-size: 8px; line-height: 11px; color: var(--muted); }

/* pr cards */
.pr-scroll { display: flex; gap: 9px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.pr-scroll::-webkit-scrollbar { display: none; }
.pr-card {
  flex: none; min-width: 132px; background: var(--card); border: 1px solid var(--line);
  border-radius: 16px; padding: 12px 13px; box-shadow: var(--shadow-sm);
}
.pr-card .name { font-size: 11.5px; color: var(--muted); }
.pr-card .val { font-size: 20px; font-weight: 650; letter-spacing: -.5px; margin-top: 4px; }
.pr-card .val small { font-size: 10px; color: var(--muted); font-weight: 500; margin-left: 2px; }

  return '¥' + v.toLocaleString('zh-CN', { maximumFractionDigits: v % 1 ? 2 : 0 });
}
function fmtKcal(n) { return fmtNum(Math.round(n || 0)); }
function fmtMinutes(n) {
  n = Math.round(n || 0);
  if (n < 60) return n + ' 分钟';
  const h = Math.floor(n / 60), m = n % 60;
  return h + ' 小时' + (m ? ' ' + m + ' 分' : '');
}
function fmtDuration(n) {
  n = Math.round(n || 0);
  if (n < 60) return n + '′';
  const h = Math.floor(n / 60), m = n % 60;
  return h + 'h' + (m ? m + '′' : '');
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}
function nl2br(s) { return esc(s).replace(/\n/g, '<br>'); }
function niceMax(v) {
  if (!v || v <= 0) return 10;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / p;
  const step = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find((s) => s >= n) || 10;
  return step * p;
}
function e1rm(weight, reps) {
  if (!weight || !reps) return 0;
  return reps === 1 ? weight : weight * (1 + reps / 30);
}

/* ------------------------------ store ------------------------------ */
function defaultDB() {
  return {
    version: 1,
    meta: { created: todayISO(), seenWelcome: false, demo: false, updated: Date.now() },
    settings: { ...DEFAULT_SETTINGS },
    savings: [],
    expenses: [],
    workouts: [],
    studies: [],
    readings: [],
    daily: [],
    weights: [],
    meals: [],
    water: [],
    habits: [],
    habitLogs: {},
    health: [],
  };
}
function loadDB() {
  try {
    const raw = JSON.parse(localStorage.getItem(DB_KEY) || 'null');
    if (!raw) return defaultDB();
    const d = defaultDB();
    const out = { ...d, ...raw };
    out.settings = { ...d.settings, ...(raw.settings || {}) };
    out.meta = { ...d.meta, ...(raw.meta || {}) };
    for (const k of ['savings', 'expenses', 'workouts', 'studies', 'readings', 'daily', 'weights', 'meals', 'water', 'habits', 'health']) {
      if (!Array.isArray(out[k])) out[k] = [];
    }
    if (!out.habitLogs || typeof out.habitLogs !== 'object') out.habitLogs = {};
    return out;
  } catch (e) {
    console.warn('读取数据失败', e);
    return defaultDB();
  }
}
let db = loadDB();
function save() {
  db.meta.updated = Date.now();
  try {
    localStorage.setItem(DB_KEY, JSON.stringify(db));
    return true;
  } catch (e) {
    toast('保存失败：手机存储空间可能已满');
    return false;
  }
}

/* ------------------------------ derived data ------------------------------ */
function savingsBalance() {
  return Number(db.settings.initialSavings || 0)
    + sum(db.savings, (r) => (r.type === 'withdraw' ? -r.amount : r.amount));
}
function monthSavingsNet(key) {
  return sum(db.savings.filter((r) => monthKey(r.date) === key), (r) => (r.type === 'withdraw' ? -r.amount : r.amount));
}
function expensesIn(key) {
  return db.expenses.filter((e) => monthKey(e.date) === key);
}
function expenseByCat(key) {
  const map = {};
  for (const e of expensesIn(key)) map[e.cat] = (map[e.cat] || 0) + Number(e.amount || 0);
  return EXPENSE_CATS.map((c) => ({ ...c, value: map[c.id] || 0 })).filter((c) => c.value > 0);
}
function todayWorkoutKcal() {
  return sum(db.workouts.filter((w) => w.date === todayISO()), (w) => w.kcal);
}
function todayExpense() {
  return sum(db.expenses.filter((e) => e.date === todayISO()), (e) => e.amount);
}
function todayStudy() {
  return sum(db.studies.filter((s) => s.date === todayISO()), (s) => s.minutes);
}
function todayWater() {
  return sum(db.water.filter((w) => w.date === todayISO()), (w) => w.ml);
}
function todayMeals() {
  return db.meals.filter((m) => m.date === todayISO());
}
function latestWeight() {
  const sorted = [...db.weights].sort((a, b) => b.date.localeCompare(a.date));
  if (sorted.length) return Number(sorted[0].weight) || Number(db.settings.weight) || 70;
  return Number(db.settings.weight) || 70;
}
function weeklyWorkouts(date = todayISO()) {
  const start = weekStart(date);
  return db.workouts.filter((w) => w.date >= start && w.date <= addDays(start, 6));
}
function weeklyKcal(date = todayISO()) {
  return sum(weeklyWorkouts(date), (w) => w.kcal);
}
function weeklyVolume(date = todayISO()) {
  let v = 0;
  for (const w of weeklyWorkouts(date)) {
    for (const ex of w.exercises || []) v += (Number(ex.sets) || 0) * (Number(ex.reps) || 0) * (Number(ex.weight) || 0);
  }
  return v;
}
function workoutVolume(w) {
  return sum(w.exercises || [], (ex) => (Number(ex.sets) || 0) * (Number(ex.reps) || 0) * (Number(ex.weight) || 0));
}
function workoutStreak() {
  const days = new Set(db.workouts.map((w) => w.date));
  let cursor = days.has(todayISO()) ? todayISO() : addDays(todayISO(), -1);
  if (!days.has(cursor)) return 0;
  let n = 0;
  while (days.has(cursor)) { n++; cursor = addDays(cursor, -1); }
  return n;
}
function recordStreak() {
  const days = new Set();
  const push = (arr) => arr.forEach((r) => r.date && days.add(r.date));
  push(db.savings); push(db.expenses); push(db.workouts); push(db.studies);
  push(db.readings); push(db.daily); push(db.weights); push(db.meals); push(db.water); push(db.health);
  Object.values(db.habitLogs).forEach((arr) => (arr || []).forEach((d) => days.add(d)));
  let cursor = days.has(todayISO()) ? todayISO() : addDays(todayISO(), -1);
  if (!days.has(cursor)) return 0;
  let n = 0;
  while (days.has(cursor)) { n++; cursor = addDays(cursor, -1); }
  return n;
}
function dailyStreak() {
  const days = new Set(db.daily.map((d) => d.date));
  let cursor = days.has(todayISO()) ? todayISO() : addDays(todayISO(), -1);
  if (!days.has(cursor)) return 0;
  let n = 0;
  while (days.has(cursor)) { n++; cursor = addDays(cursor, -1); }
  return n;
}
function prs() {
  const best = {};
  for (const w of db.workouts) {
    for (const ex of w.exercises || []) {
      const orm = e1rm(Number(ex.weight) || 0, Number(ex.reps) || 0);
      if (!orm) continue;
      if (!best[ex.name] || orm > best[ex.name].orm) {
        best[ex.name] = { name: ex.name, orm, weight: Number(ex.weight), reps: Number(ex.reps), date: w.date };
      }
    }
  }
  return Object.values(best).sort((a, b) => b.orm - a.orm);
}
function muscleStats(key = monthKey(todayISO())) {
  const counts = {};
  for (const w of db.workouts) {
    if (monthKey(w.date) !== key) continue;
    for (const m of w.muscles || []) counts[m] = (counts[m] || 0) + 1;
  }
  return MUSCLES.map((m) => ({ name: m, value: counts[m] || 0 })).filter((x) => x.value > 0).sort((a, b) => b.value - a.value);
}
function habitLogArr(id) { return db.habitLogs[id] || []; }
function habitStreak(id) {
  const days = new Set(habitLogArr(id));
  let cursor = days.has(todayISO()) ? todayISO() : addDays(todayISO(), -1);
  if (!days.has(cursor)) return 0;
  let n = 0;
  while (days.has(cursor)) { n++; cursor = addDays(cursor, -1); }
  return n;
}
function goalStats() {
  const s = db.settings;
  const start = s.startDate, end = s.endDate;
  const total = Math.max(1, daysBetween(start, end) + 1);
  const elapsed = clamp(daysBetween(start, todayISO()) + 1, 0, total);
  const remaining = Math.max(0, daysBetween(todayISO(), end));
  const balance = savingsBalance();
  const target = Math.max(1, Number(s.targetAmount) || 1);
  return {
    total, elapsed, remaining, dayIndex: elapsed,
    timePct: clamp((elapsed / total) * 100, 0, 100),
    balance, target,
    savePct: clamp((balance / target) * 100, 0, 100),
    gap: Math.max(0, target - balance),
  };
}

/* ------------------------------ theme ------------------------------ */
function resolvedTheme() {
  const t = db.settings.theme || 'auto';
  if (t === 'light' || t === 'dark') return t;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme() {
  const t = resolvedTheme();
  document.documentElement.setAttribute('data-theme', t);
  const meta = document.getElementById('theme-color');
  if (meta) meta.setAttribute('content', t === 'dark' ? '#0E0D0C' : '#F3EEE3');
}

  const cur = resolvedTheme();
  db.settings.theme = cur === 'dark' ? 'light' : 'dark';
  save();
  applyTheme();
  render();

}

function barChart(data, opts = {}) {
  const W = 340, H = opts.height || 150;
  const PL = 34, PR = 12, PT = 20, PB = 22;
  const plotW = W - PL - PR, plotH = H - PT - PB;
  const max = niceMax(Math.max(...data.map((d) => d.value), 0));
  const band = plotW / data.length;
  const bw = Math.min(24, band * 0.55);
  const y = (v) => PT + plotH - (v / max) * plotH;
  const ticks = [0, 0.5, 1].map((t) => max * t);
  const labelEvery = data.length > 9 ? Math.ceil(data.length / 7) : 1;

  const bars = data.map((d, i) => {
    const x = PL + i * band + (band - bw) / 2;
    const h = Math.max(d.value > 0 ? 2 : 0, (d.value / max) * plotH);
    const top = PT + plotH - h;
    const path = h > 0
      ? `M${x} ${PT + plotH} L${x} ${top + 4} Q${x} ${top} ${x + 4} ${top} L${x + bw - 4} ${top} Q${x + bw} ${top} ${x + bw} ${top + 4} L${x + bw} ${PT + plotH} Z`
      : '';
    const showLabel = i === data.length - 1 && d.value > 0;
    return `
      <path class="bar" d="${path}" fill="${opts.color || 'var(--gold)'}" opacity="${opts.dim && !showLabel ? 0.85 : 1}"/>
      ${showLabel ? `<text class="value-label" x="${x + bw / 2}" y="${Math.max(PT - 5, top - 6)}" text-anchor="middle">${opts.format ? opts.format(d.value) : fmtNum(d.value)}</text>` : ''}
      <rect class="bar-hit" x="${PL + i * band}" y="${PT}" width="${band}" height="${plotH}" data-tip="${esc(d.tip || d.label + ' · ' + (opts.format ? opts.format(d.value) : d.value))}"/>
      ${i % labelEvery === 0 || i === data.length - 1 ? `<text class="axis-label" x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${esc(d.label)}</text>` : ''}
    `;
  }).join('');

  const grid = [0, 1, 2].map((i) => {
    const v = ticks[i], yy = y(v);
    return `<line class="grid" x1="${PL}" y1="${yy}" x2="${W - PR}" y2="${yy}"/>
      <text class="axis-label" x="${PL - 6}" y="${yy + 3}" text-anchor="end">${compactNum(v)}</text>`;
  }).join('');

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || '柱状图')}">
    ${grid}${bars}
  </svg>`;
}
function compactNum(v) {
  if (v >= 10000) return (v / 10000).toFixed(v % 10000 ? 1 : 0).replace(/\.0$/, '') + '万';
  if (v >= 1000) return (v / 1000).toFixed(v % 1000 ? 1 : 0).replace(/\.0$/, '') + 'k';
  return fmtNum(v);
}

function lineChart(data, opts = {}) {
  const W = 340, H = opts.height || 150;
  const PL = 36, PR = 16, PT = 16, PB = 22;
  const plotW = W - PL - PR, plotH = H - PT - PB;
  if (data.length < 2) return chartEmpty('至少需要两条记录才能画出趋势。');
  const vals = data.map((d) => d.value);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (min === max) { min -= 1; max += 1; }
  const padV = (max - min) * 0.12;
  min -= padV; max += padV;
  const x = (i) => PL + (i / (data.length - 1)) * plotW;
  const y = (v) => PT + plotH - ((v - min) / (max - min)) * plotH;
  const pts = data.map((d, i) => [x(i), y(d.value)]);
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  const area = `${path} L${x(data.length - 1).toFixed(1)} ${PT + plotH} L${PL} ${PT + plotH} Z`;
  const color = opts.color || 'var(--gold)';
  const showAll = data.length <= 12;
  const dots = data.map((d, i) => {
    if (!showAll && i !== data.length - 1) return '';
    return `<circle class="dot" cx="${pts[i][0]}" cy="${pts[i][1]}" r="4" fill="${color}"/>
      <circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="11" fill="transparent" data-tip="${esc(d.tip || d.label + ' · ' + d.value)}"/>`;
  }).join('');
  const last = data[data.length - 1];
  const lastY = Math.max(PT + 10, pts[pts.length - 1][1] - 9);
  const grid = [0, 1].map((i) => {
    const v = min + (max - min) * (i ? 0.92 : 0.08);
    return `<line class="grid" x1="${PL}" y1="${y(v)}" x2="${W - PR}" y2="${y(v)}"/>
      <text class="axis-label" x="${PL - 6}" y="${y(v) + 3}" text-anchor="end">${opts.format ? opts.format(v) : compactNum(v)}</text>`;
  }).join('');

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || '趋势图')}">
    ${grid}
    <defs><linearGradient id="lg-${opts.id || 'a'}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".14"/><stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#lg-${opts.id || 'a'})"/>
    <path class="line-path" d="${path}" stroke="${color}"/>
    ${dots}
    <text class="end-label" x="${pts[pts.length - 1][0]}" y="${lastY}" text-anchor="end">${opts.format ? opts.format(last.value) : last.value}</text>
    <text class="axis-label" x="${PL}" y="${H - 5}">${esc(data[0].label)}</text>
    <text class="axis-label" x="${W - PR}" y="${H - 5}" text-anchor="end">${esc(last.label)}</text>
  </svg>`;
}

function donutChart(data, total) {
  const R = 52, C = 2 * Math.PI * R;
  let offset = 0;
  const segs = data.map((d) => {
    const frac = total > 0 ? d.value / total : 0;
    const len = Math.max(0, frac * C - 2.5);
    const s = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${d.color}" stroke-width="16"
      stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}"
      transform="rotate(-90 70 70)"/>`;
    offset += frac * C;
    return s;
  }).join('');
  return `<svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="支出分类占比">
    <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--card-2)" stroke-width="16"/>
    ${segs}
  </svg>`;
}

function heatmap(counts, opts = {}) {
  const weeks = opts.weeks || 12;
  const today = todayISO();
  const start = addDays(weekStart(today), -7 * (weeks - 1));
  const max = Math.max(1, ...Object.values(counts));
  const level = (n) => n <= 0 ? 0 : n >= max ? 4 : Math.min(4, Math.ceil((n / max) * 4));
  let cols = '';
  for (let w = 0; w < weeks; w++) {
    let cells = '';
    for (let d = 0; d < 7; d++) {
      const date = addDays(start, w * 7 + d);
      const future = date > today;
      const n = counts[date] || 0;
      cells += `<div class="hm-cell ${future ? 'future' : 'l' + level(n)}" ${future ? '' : `data-tip="${fmtDate(date, false)} · ${n ? (opts.unit ? n + opts.unit : n + ' 次') : (opts.none || '没有记录')}"`}></div>`;
    }
    cols += `<div class="hm-week">${cells}</div>`;
  }
  return `<div class="heatmap">${cols}</div>
    <div class="hm-legend"><span>少</span><div class="hm-cell l0"></div><div class="hm-cell l1"></div><div class="hm-cell l2"></div><div class="hm-cell l3"></div><div class="hm-cell l4"></div><span>多</span></div>`;
}

function bookMap() {
  const map = {};
  for (const r of db.readings) {
    const name = String(r.book || '').trim();
    if (!name) continue;
    if (!map[name]) map[name] = { name, minutes: 0, pages: 0, sessions: 0, last: '', finished: false };
    const b = map[name];
    b.minutes += Number(r.minutes) || 0;
    b.pages += Number(r.pages) || 0;
    b.sessions += 1;
    if (!b.last || r.date > b.last) b.last = r.date;
    if (r.finished) b.finished = true;
  }
  return Object.values(map).sort((a, b) => b.last.localeCompare(a.last));
}

/* ================================================================
   WATCH · 小米运动健康数据导入
   官方导出的 CSV / JSON 在本地解析，不上传、不登录、不调用第三方接口。
   ================================================================ */
const WATCH_KEY_METRIC = {
  steps: 'steps', step: 'steps', stepcount: 'steps', totalsteps: 'steps', stepnum: 'steps',
  distance: 'distance', distancem: 'distance', totaldistance: 'distance', distancekm: 'distanceKm',
  calories: 'activeKcal', calorie: 'activeKcal', activecalories: 'activeKcal', activecalorie: 'activeKcal',
  totalcal: 'activeKcal', energyconsume: 'activeKcal', activeenergy: 'activeKcal',
  activeminutes: 'activeMinutes', activetime: 'activeMinutes', activityminutes: 'activeMinutes',
  exerciseminutes: 'activeMinutes', exercisetime: 'activeMinutes',
  sleep: 'sleepMinutes', sleepminutes: 'sleepMinutes', sleepduration: 'sleepMinutes', sleeptime: 'sleepMinutes',
  sleepscore: 'sleepScore', sleepquality: 'sleepScore',
  restinghr: 'restingHr', restingheartrate: 'restingHr', rhr: 'restingHr', resthr: 'restingHr',
  avghr: 'avgHr', avghrm: 'avgHr', averageheartrate: 'avgHr',
};

const WATCH_SPORT_RULES = [
  [/treadmill|indoor.?run|跑步机|室内跑/i, 'jog'],
  [/outdoor.?run|running|\brun\b|跑步|户外跑/i, 'run'],
  [/hike|hiking|徒步|登山/i, 'hike'],
  [/walk|步行|健走|散步/i, 'walk'],
  [/spin(ning)?|动感单车/i, 'spin'],
  [/cycl|bike|biking|ride|骑行|单车/i, 'cycle'],
  [/swim|游泳/i, 'swim'],
  [/(jump.?rope|rope.?skip)|跳绳/i, 'rope'],
  [/elliptical|椭圆/i, 'elliptical'],
  [/row(ing)?|划船/i, 'rower'],
  [/stair|爬楼/i, 'stair'],
  [/strength|dumbbell|barbell|weight.?train|力量|哑铃|杠铃/i, 'strength'],
  [/hiit|tabata|间歇/i, 'hiit'],
  [/pilates|普拉提/i, 'pilates'],
  [/yoga|瑜伽/i, 'yoga'],
  [/stretch|拉伸/i, 'stretch'],
  [/basketball|篮球/i, 'basketball'],
  [/football|soccer|足球/i, 'football'],
  [/badminton|羽毛球/i, 'badminton'],
  [/table.?tennis|ping.?pong|乒乓/i, 'pingpong'],
  [/tennis|网球/i, 'tennis'],
  [/dance|舞蹈|街舞/i, 'dance'],
  [/ski|滑雪/i, 'ski'],
  [/boxing|kickbox|fight|格斗|拳击/i, 'fight'],
  [/aerobics|有氧操/i, 'aerobics'],
];

function normKey(s) { return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, ''); }
function watchNum(v) {
  if (v == null || v === '') return 0;
  const n = Number(String(v).replace(/[^\d.\-]/g, ''));
  return isFinite(n) ? n : 0;
}
const watchNormCache = new WeakMap();
function watchFirst(obj, keys) {
  if (!obj || typeof obj !== 'object') return null;
  let norm = watchNormCache.get(obj);
  if (!norm) {
    norm = {};
    Object.keys(obj).forEach((k) => { norm[normKey(k)] = obj[k]; });
    watchNormCache.set(obj, norm);
  }
  for (const k of keys) {
    const v = norm[normKey(k)];
    if (v != null && v !== '') return v;
  }
  return null;
}
function watchTsToISO(v) {
  if (v == null || v === '') return '';
  const s = String(v).trim();
  if (/^\d{10,13}$/.test(s)) {
    let n = Number(s);
    if (n < 1e12) n *= 1000;
    const d = new Date(n);
    return isNaN(d.getTime()) ? '' : iso(d);
  }
  const m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if (m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  const d = new Date(s);
  return isNaN(d.getTime()) ? '' : iso(d);
}

/* RFC4180-ish CSV parser: handles quotes, escaped quotes, CRLF and BOM. */
function parseCSVRows(text) {
  const src = String(text).replace(/^﻿/, '');
  const rows = [];
  let row = [], cur = '', quoted = false;
  for (let i = 0; i < src.length; i++) {
    const c = src[i];
    if (quoted) {
      if (c === '"') {
        if (src[i + 1] === '"') { cur += '"'; i++; } else quoted = false;
      } else cur += c;
    } else if (c === '"') quoted = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); cur = ''; rows.push(row); row = []; }
    else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

function parseWatchCSV(text) {
  const rows = parseCSVRows(text);
  let hi = -1;
  for (let i = 0; i < Math.min(rows.length, 30); i++) {
    const n = rows[i].map(normKey);
    if (n.includes('value') && (n.includes('key') || n.includes('sid'))) { hi = i; break; }
  }
  if (hi < 0) return [];
  const head = rows[hi].map(normKey);
  const idx = (name) => head.indexOf(normKey(name));
  const iVal = idx('Value'), iTime = idx('Time'), iKey = idx('Key'), iCat = idx('Category'), iTag = idx('Tag'), iSid = idx('Sid');
  const cell = (r, j) => (j >= 0 ? String(r[j] == null ? '' : r[j]) : '');
  const entries = [];
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r || !r.some((c) => String(c).trim())) continue;
    const raw = cell(r, iVal).trim();
    if (!raw) continue;
    let obj = null;
    try {
      const j = JSON.parse(raw);
      if (j && typeof j === 'object') obj = j;
    } catch (e) { /* flat value */ }
    entries.push({ obj, raw, time: cell(r, iTime), key: cell(r, iKey), cat: cell(r, iCat), tag: cell(r, iTag), sid: cell(r, iSid) });
  }
  return entries;
}

function walkWatchJSON(root) {
  const out = [];
  const seen = new Set();
  const visit = (v, depth) => {
    if (!v || depth > 4 || typeof v !== 'object' || seen.has(v)) return;
    seen.add(v);
    if (Array.isArray(v)) { v.forEach((x) => visit(x, depth + 1)); return; }
    if (v.sport_type != null || v.sportType != null || v.start_time != null || v.steps != null || v.sleep_minutes != null || v.weight != null) {
      out.push({ obj: v, raw: '', time: '', key: '', cat: '', tag: '', sid: '' });
    }
    Object.values(v).forEach((x) => visit(x, depth + 1));
  };
  visit(root, 0);
  return out;
}

function watchActivity(raw, extra) {
  const text = [raw, extra].filter((x) => x != null && x !== '').join(' ');
  for (const [re, id] of WATCH_SPORT_RULES) {
    if (re.test(text)) return actById(id);
  }
  return actById('custom');
}

function watchWorkoutFrom(obj, fallbackDate, e) {
  const startRaw = watchFirst(obj, ['start_time', 'startTime', 'start', 'begin_time', 'beginTime', 'time']);
  const date = watchTsToISO(startRaw) || fallbackDate || watchTsToISO(e.time);
  if (!date) return null;

  let seconds = watchNum(watchFirst(obj, ['duration', 'duration_s', 'duration_sec', 'duration_second', 'duration_seconds', 'exercise_time', 'workout_time', 'total_time']));
  const durMin = watchNum(watchFirst(obj, ['duration_min', 'duration_minutes', 'minutes']));
  let minutes = durMin > 0 ? durMin : Math.round(seconds / 60);
  if (!durMin && seconds > 0 && minutes > 24 * 60) minutes = Math.round(seconds / 1000 / 60);

  const sportRaw = watchFirst(obj, ['sport_type', 'sportType', 'type', 'category']);
  const nameRaw = watchFirst(obj, ['sport_name', 'sportName', 'name', 'title', 'category']);
  const act = watchActivity(sportRaw, [nameRaw, e.cat].filter(Boolean).join(' '));

  let km = 0;
  const kmRaw = watchNum(watchFirst(obj, ['distance_km', 'distanceKm']));
  if (kmRaw > 0) km = kmRaw;
  else {
    const mRaw = watchNum(watchFirst(obj, ['distance', 'distance_m', 'total_distance']));
    if (mRaw > 0) km = mRaw / 1000;
  }

  let kcal = Math.round(watchNum(watchFirst(obj, ['calories', 'calorie', 'kcal', 'energy_consume', 'total_cal'])));
  if (!kcal && minutes > 0) kcal = Math.round((act.met * latestWeight() * minutes) / 60);
  if (!minutes && !kcal) return null;

  const avgHr = Math.round(watchNum(watchFirst(obj, ['avg_hrm', 'avg_hr', 'average_heart_rate', 'avg_heart_rate', 'heart_rate_avg'])));
  const maxHr = Math.round(watchNum(watchFirst(obj, ['max_hrm', 'max_hr', 'max_heart_rate'])));
  const steps = Math.round(watchNum(watchFirst(obj, ['steps', 'step_count', 'total_steps'])));
  const extId = String(
    watchFirst(obj, ['sid', 'id', 'record_id', 'recordId']) || e.sid
    || [date, sportRaw == null ? '' : sportRaw, seconds || minutes, startRaw == null ? '' : startRaw].join('|')
  );

  return {
    id: uid(), date, type: act.type, activity: act.id, activityName: act.name, met: act.met,
    minutes: minutes || 0, bodyweight: latestWeight(), distance: km ? Math.round(km * 100) / 100 : '',
    hr: avgHr || '', maxHr: maxHr || '', steps: steps || 0, rpe: '', muscles: [], exercises: [],
    kcal, note: '', source: 'xiaomi', extId,
  };
}

function watchHealthFrom(obj, fallbackDate, e) {
  const date = watchTsToISO(watchFirst(obj, ['date', 'day', 'time'])) || fallbackDate || watchTsToISO(e.time);
  if (!date) return null;

  const h = {
    steps: Math.round(watchNum(watchFirst(obj, ['steps', 'step', 'step_count', 'total_steps']))),
    distance: Math.round(watchNum(watchFirst(obj, ['distance', 'distance_m', 'total_distance']))),
    activeKcal: Math.round(watchNum(watchFirst(obj, ['calories', 'calorie', 'active_calories', 'active_calorie', 'total_cal', 'energy_consume']))),
    activeMinutes: Math.round(watchNum(watchFirst(obj, ['active_minutes', 'active_time', 'activity_minutes', 'exercise_minutes']))),
    sleepMinutes: Math.round(watchNum(watchFirst(obj, ['sleep_minutes', 'sleep_duration', 'sleep_time']))),
    sleepScore: Math.round(watchNum(watchFirst(obj, ['sleep_score', 'sleep_quality']))),
    restingHr: Math.round(watchNum(watchFirst(obj, ['resting_hr', 'resting_heart_rate', 'rhr', 'rest_hr']))),
    avgHr: Math.round(watchNum(watchFirst(obj, ['avg_hr', 'avg_hrm', 'average_heart_rate']))),
  };
  const km = watchNum(watchFirst(obj, ['distance_km', 'distanceKm']));
  if (km > 0) h.distance = Math.round(km * 1000);

  /* Aggregated exports can be one metric per row: Key=steps, Value={"count":N}. */
  const keyField = WATCH_KEY_METRIC[normKey(e.key)];
  if (keyField) {
    const v = Math.round(watchNum(obj.count != null ? obj.count : e.raw));
    if (v > 0) {
      if (keyField === 'distanceKm') h.distance = Math.round(v * 1000);
      else if (!h[keyField]) h[keyField] = v;
    }
  }

  if (h.sleepMinutes > 24 * 60) h.sleepMinutes = Math.round(h.sleepMinutes / 60);
  const has = h.steps || h.distance || h.activeKcal || h.sleepMinutes || h.restingHr;
  if (!has) return null;
  return { id: uid(), date, ...h, source: 'xiaomi', extId: 'xiaomi:' + date };
}

function watchWeightFrom(obj, fallbackDate, e) {
  const date = watchTsToISO(watchFirst(obj, ['date', 'day', 'time', 'start_time'])) || fallbackDate || watchTsToISO(e.time);
  const w = watchNum(watchFirst(obj, ['weight', 'body_weight', 'bodyweight', 'weight_kg']));
  if (!date || w < 20 || w > 400) return null;
  return { id: uid(), date, weight: Math.round(w * 10) / 10, source: 'xiaomi', extId: 'xiaomi-w:' + date };
}

function mergeWatchHealth(list) {
  const map = {};
  for (const h of list) {
    if (!map[h.date]) { map[h.date] = { ...h }; continue; }
    const target = map[h.date];
    for (const [k, v] of Object.entries(h)) {
      if (v && (v !== 0) && (!target[k] || target[k] === 0)) target[k] = v;
    }
  }
  return Object.keys(map).sort().map((d) => map[d]);
}

function parseWatchText(text, fileName = '') {
  const res = { workouts: [], health: [], weights: [], rows: 0, skipped: 0 };
  let entries;
  if (/\.json$/i.test(fileName) || /^\s*[\[{]/.test(String(text))) {
    try { entries = walkWatchJSON(JSON.parse(text)); } catch (err) { entries = []; }
  } else {
    entries = parseWatchCSV(text);
  }
  for (const e of entries) {
    res.rows++;
    const obj = e.obj || {};
    const fallbackDate = watchTsToISO(e.time);
    const cat = String(e.cat || '').toLowerCase();
    const sportish = obj.sport_type != null || obj.sportType != null
      || /sport|run|walk|cycl|swim|ride|training|workout/i.test(cat)
      || (obj.start_time != null && (obj.duration != null || obj.calories != null));
    if (sportish) {
      const w = watchWorkoutFrom(obj, fallbackDate, e);
      if (w) res.workouts.push(w); else res.skipped++;
      continue;
    }
    const wt = watchWeightFrom(obj, fallbackDate, e);
    if (wt) { res.weights.push(wt); continue; }
    const h = watchHealthFrom(obj, fallbackDate, e);
    if (h) res.health.push(h); else res.skipped++;
  }
  res.health = mergeWatchHealth(res.health);
  res.weights = res.weights.filter((w, i, arr) => arr.findIndex((x) => x.date === w.date) === i);
  return res;
}

function applyWatchImport(parsed) {
  if (!parsed) return { workouts: 0, health: 0, weights: 0, dup: 0 };
  const stats = { workouts: 0, health: 0, weights: 0, dup: 0 };
  const wIds = new Set(db.workouts.filter((w) => w.source === 'xiaomi').map((w) => String(w.extId)));
  const hDates = new Set(db.health.map((h) => h.date));

  for (const w of parsed.workouts || []) {
    if (wIds.has(String(w.extId))) { stats.dup++; continue; }
    db.workouts.push(w); wIds.add(String(w.extId)); stats.workouts++;
  }
  for (const h of parsed.health || []) {
    const exist = db.health.find((x) => x.date === h.date);
    if (exist) {
      let changed = false;
      for (const k of ['steps', 'distance', 'activeKcal', 'activeMinutes', 'sleepMinutes', 'sleepScore', 'restingHr', 'avgHr']) {
        if (h[k] && h[k] !== exist[k]) { exist[k] = h[k]; changed = true; }
      }
      if (changed) stats.health++; else stats.dup++;
    } else {
      db.health.push(h); stats.health++;
    }
  }
  for (const w of parsed.weights || []) {
    if (hDates.has(w.date) || db.weights.some((x) => x.date === w.date)) { stats.dup++; continue; }
    db.weights.push(w); stats.weights++;
  }

  if (stats.workouts || stats.health || stats.weights) save();
  render();
  const bits = [];
  if (stats.workouts) bits.push(`${stats.workouts} 次运动`);
  if (stats.health) bits.push(`${stats.health} 天日常`);
  if (stats.weights) bits.push(`${stats.weights} 条体重`);
  if (bits.length) toast('已导入手表数据：' + bits.join('、'));
  else if (stats.dup) toast('这些记录之前已经导入过');
  else toast('没有识别到可用记录');
  return stats;
}

function watchLatestHealth(date) {
  const rows = [...db.health].sort((a, b) => a.date.localeCompare(b.date));
  return date ? rows.filter((r) => r.date === date).pop() : rows[rows.length - 1];
}

function watchHomeSection() {
  if (!db.health.length) return '';
  const latest = watchLatestHealth();
  const today = latest.date === todayISO();
  return `<div class="section">
    <div class="section-head"><h3>手表 · ${today ? '今天' : fmtDate(latest.date, false)}</h3><button class="link" data-act="nav" data-route="watch">全部 ${ic('right', 14)}</button></div>
    <div class="card card-pad">
      <div class="stat-grid">
        <div class="stat"><div class="stat-label">${ic('shoe', 13)}步数</div><div class="stat-value">${latest.steps ? fmtNum(latest.steps) : '—'}<small>步</small></div><div class="stat-foot">${latest.distance ? (latest.distance / 1000).toFixed(2) + ' km' : '手表同步'}</div></div>
        <div class="stat"><div class="stat-label">${ic('moon', 13)}睡眠</div><div class="stat-value">${latest.sleepMinutes ? fmtDuration(latest.sleepMinutes) : '—'}</div><div class="stat-foot">${latest.sleepScore ? '睡眠评分 ' + latest.sleepScore : ''}</div></div>
        <div class="stat"><div class="stat-label">${ic('flame', 13)}活动消耗</div><div class="stat-value">${latest.activeKcal ? fmtKcal(latest.activeKcal) : '—'}<small>千卡</small></div><div class="stat-foot">${latest.activeMinutes ? latest.activeMinutes + ' 分钟活动' : ''}</div></div>
        <div class="stat"><div class="stat-label">${ic('heart', 13)}静息心率</div><div class="stat-value">${latest.restingHr || '—'}<small>bpm</small></div><div class="stat-foot">${latest.avgHr ? '平均 ' + latest.avgHr + ' bpm' : ''}</div></div>
      </div>
    </div>
  </div>`;
}

function readWatchFile(file, done) {
  if (file.size > 80 * 1024 * 1024) { toast('文件太大，请只导入 sport_record.csv'); return; }
  const reader = new FileReader();
  reader.onload = () => done(String(reader.result || ''), file.name);
  reader.onerror = () => toast('读取文件失败，请再试一次');
  reader.readAsText(file);
}

function sheetImportWatch() {
  openSheet({
    title: '导入手表数据',
    subtitle: '小米运动健康 · 官方导出文件',
    submit: '导入',
    body: `
      ${field('选择文件', `<input class="input" type="file" id="watch-file" accept=".csv,.json,text/csv,application/json">
        <div class="hint">支持 <b>*_sport_record.csv</b>、<b>aggregated_fitness_data.csv</b>，以及 JSON 备份。文件在本机解析。</div>`)}
      <div id="watch-preview" class="form-note">还没有选择文件</div>
      <div class="divider"></div>
      <div class="field-label">官方导出路径</div>
      <ol class="watch-steps">
        <li>手机「小米运动健康」→ 我的 → 隐私中心</li>
        <li>管理您的数据 → Mi Fitness → 申请导出</li>
        <li>邮箱取下载链接，按网页上的密码解压</li>
        <li>选择 sport_record.csv 或 aggregated_fitness_data.csv</li>
      </ol>
      <div class="form-note mt8">运动记录会写入「健身」，步数/睡眠/心率会写入「手表数据」。不会上传，重复导入会跳过。</div>
    `,
    afterMount(form) {
      const input = form.querySelector('#watch-file');
      const preview = form.querySelector('#watch-preview');
      form.__watchParsed = null;
      input.addEventListener('change', () => {
        const f = input.files && input.files[0];
        if (!f) return;
        form.__watchParsed = null;
        preview.textContent = '正在解析…';
        readWatchFile(f, (text, name) => {
          try {
            const parsed = parseWatchText(text, name);
            form.__watchParsed = parsed;
            const dates = [...parsed.workouts.map((w) => w.date), ...parsed.health.map((h) => h.date)].sort();
            const range = dates.length ? `${dates[0]} → ${dates[dates.length - 1]}` : '无';
            if (parsed.workouts.length || parsed.health.length || parsed.weights.length) {
              preview.innerHTML = `识别到：<b>${parsed.workouts.length}</b> 次运动 · <b>${parsed.health.length}</b> 天日常数据 · <b>${parsed.weights.length}</b> 条体重<br>时间范围：${range}`;
            } else {
              preview.innerHTML = '没有识别到可用记录。请确认选的是小米官方导出的 <b>sport_record.csv</b> 或 <b>aggregated_fitness_data.csv</b>。';
            }
          } catch (err) {
            preview.textContent = '解析失败，请确认文件格式';
          }
        });
      });
    },
    onSubmit(form) {
      const parsed = form.__watchParsed;
      if (!parsed) { toast('先选择一个导出文件，等识别完成'); return false; }
      applyWatchImport(parsed);
    },
  });
}

function bmiInfo(w, h) {
  if (!w || !h) return null;
  const bmi = w / Math.pow(h / 100, 2);
  let label = '正常', color = 'var(--good)';
  if (bmi < 18.5) { label = '偏瘦'; color = 'var(--info)'; }
  else if (bmi >= 28) { label = '肥胖'; color = 'var(--critical)'; }
  else if (bmi >= 24) { label = '超重'; color = 'var(--series-4)'; }
  return { bmi, label, color };
}

function openSheet(opts) {
  const root = document.getElementById('sheet-root');
  const secondary = opts.secondary ? `<button type="button" class="btn btn-ghost" data-sheet-secondary>${opts.secondary}</button>` : '';
  root.innerHTML = `<div class="sheet-overlay" data-sheet-overlay>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-grab"></div>
      <div class="sheet-head">
        <div style="flex:1"><h2 id="sheet-title">${opts.title || ''}</h2>${opts.subtitle ? `<p>${opts.subtitle}</p>` : ''}</div>
        <button type="button" class="sheet-close" data-sheet-close aria-label="关闭">${ic('x', 18)}</button>
      </div>
      <form class="sheet-form" id="sheet-form" novalidate>
        <div class="sheet-body">${opts.body || ''}</div>
        <div class="sheet-actions">
          ${secondary}
          <button type="button" class="btn btn-ghost" data-sheet-close>取消</button>
          <button type="submit" class="btn btn-primary">${opts.submit || '保存'}</button>
        </div>
      </form>
    </div>
  </div>`;
  document.body.classList.add('sheet-open');
  sheetOpen = true;

  const overlay = root.querySelector('[data-sheet-overlay]');
  const form = root.querySelector('#sheet-form');
  const close = () => closeSheet();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  root.querySelectorAll('[data-sheet-close]').forEach((b) => b.addEventListener('click', close));
  const sec = root.querySelector('[data-sheet-secondary]');
  if (sec) sec.addEventListener('click', () => {
    const keep = opts.onSecondary ? opts.onSecondary(form) : undefined;
    if (keep !== false) close();
  });
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!opts.onSubmit) { close(); return; }
    const keep = opts.onSubmit(form, new FormData(form));
    if (keep !== false) close();
  });
  if (opts.afterMount) opts.afterMount(form);
  if (!('ontouchstart' in window)) {
    setTimeout(() => {
      const first = form.querySelector('input:not([type=hidden]):not([type=radio]):not([type=checkbox]),textarea,select');
      if (first && sheetOpen) first.focus();
    }, 90);
  }
}

function closeSheet() {
  const root = document.getElementById('sheet-root');
  if (!root.innerHTML) { sheetOpen = false; return; }
  root.innerHTML = '';
  document.body.classList.remove('sheet-open');
  sheetOpen = false;
}

function confirmDialog(opts) {
  const root = document.getElementById('sheet-root');
  root.innerHTML = `<div class="sheet-overlay dialog-overlay" data-dialog-overlay>
    <div class="dialog" role="alertdialog" aria-modal="true">
      <div class="d-ic">${ic(opts.icon || 'trash', 22)}</div>
      <h3>${opts.title}</h3>
      <p>${opts.text || ''}</p>
      <div class="btn-row">
        <button class="btn btn-ghost" data-dialog-no>取消</button>
        <button class="btn ${opts.danger === false ? 'btn-primary' : 'btn-danger'}" data-dialog-yes>${opts.ok || '删除'}</button>
      </div>
    </div>
  </div>`;
  document.body.classList.add('sheet-open');
  sheetOpen = true;
  const close = () => {
    root.innerHTML = '';
    document.body.classList.remove('sheet-open');
    sheetOpen = false;
  };
  root.querySelector('[data-dialog-overlay]').addEventListener('click', (e) => {
    if (e.target === root.querySelector('[data-dialog-overlay]')) close();
  });
  root.querySelector('[data-dialog-no]').addEventListener('click', close);

  });
}

/* ---------- WeChat Pay bill import ---------- */
const WECHAT_CAT_RULES = [
  [/滴滴|打车|出行|地铁|公交|铁路|12306|高铁|火车|航空|机票|加油|停车|单车|骑行|哈啰|青桔|充电桩|ETC|过路费/i, 'traffic'],
  [/美团|饿了么|外卖|餐饮|餐|饭|面|粉|烧烤|火锅|咖啡|奶茶|茶饮|星巴克|瑞幸|麦当劳|肯德基|必胜客|食堂|小吃|烘焙|面包|水果/i, 'food'],
  [/书店|图书|课程|教育|培训|考试|学费|知识|得到|极客时间/i, 'study'],
  [/电影|影院|游戏|steam|演出|话剧|票务|ktv|酒吧|视频会员|音乐会员|娱乐/i, 'fun'],
  [/房租|物业|水费|电费|燃气|宽带|家政|维修|生活缴费/i, 'home'],
  [/医院|诊所|体检|口腔|医疗|挂号|药/i, 'health'],
  [/淘宝|天猫|京东|拼多多|商城|商场|超市|便利店|优衣库|服饰|鞋|数码|小米|苹果|购物|日用品|家居/i, 'shop'],
];
function wechatCategory(text) {
  for (const [re, id] of WECHAT_CAT_RULES) if (re.test(text)) return id;
  return 'other';
}
function wechatAmount(v) {
  const n = Number(String(v == null ? '' : v).replace(/[^\d.]/g, ''));
  return isFinite(n) ? Math.round(Math.abs(n) * 100) / 100 : 0;
}

function parseWechatText(text) {
  const rows = parseCSVRows(text);
  let hi = -1;
  for (let i = 0; i < Math.min(rows.length, 40); i++) {
    const line = rows[i].join('|');
    if (line.includes('交易时间') && line.includes('金额')) { hi = i; break; }
  }
  if (hi < 0) return { items: [], rows: 0, skipped: 0, income: 0, refunds: 0, transfers: 0 };
  const head = rows[hi].map((h) => String(h).replace(/\s+/g, ''));
  const find = (...names) => head.findIndex((h) => names.some((n) => h.includes(n)));
  const iTime = find('交易时间');
  const iType = find('交易类型');
  const iParty = find('交易对方');
  const iGoods = find('商品');
  const iDir = find('收/支');
  const iAmount = find('金额');
  const iPay = find('支付方式');
  const iStatus = find('当前状态');
  const iOrder = find('交易单号');
  const iRemark = find('备注');
  const cell = (r, j) => (j >= 0 && r[j] != null ? String(r[j]).trim() : '');

  const stats = { items: [], rows: 0, skipped: 0, income: 0, refunds: 0, transfers: 0 };
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r || !r.some((c) => String(c).trim())) continue;
    stats.rows++;
    const direction = cell(r, iDir);
    if (direction.includes('收入')) { stats.income++; continue; }
    if (!direction.includes('支出')) { stats.skipped++; continue; }

    const status = cell(r, iStatus);
    if (/退款|撤销|失败/.test(status)) { stats.refunds++; continue; }

    const type = cell(r, iType);
    const party = cell(r, iParty);
    const goods = cell(r, iGoods);
    const remark = cell(r, iRemark);
    if (/转账|红包|提现|零钱充值|零钱通|理财通|基金|信用卡还款|还款/i.test(type + ' ' + party)) {
      stats.transfers++; continue;
    }

    const date = cell(r, iTime).slice(0, 10);
    const amount = wechatAmount(cell(r, iAmount));
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || amount <= 0) { stats.skipped++; continue; }

    const label = [party, goods].filter(Boolean).join(' · ') || type || '微信支付';
    const extId = cell(r, iOrder) || [date, amount, party, goods, i].join('|');
    stats.items.push({
      id: uid(),
      date,
      cat: wechatCategory([type, party, goods, remark].join(' ')),
      amount,
      note: label.slice(0, 60),
      source: 'wechat',
      extId,
      payMethod: cell(r, iPay),
      tradeType: type,
    });
  }
  return stats;
}

function applyWechatImport(parsed) {
  if (!parsed) return { added: 0, dup: 0 };
  const seen = new Set(db.expenses.filter((e) => e.source === 'wechat').map((e) => String(e.extId)));
  let added = 0, dup = 0;
  for (const item of parsed.items || []) {
    if (seen.has(String(item.extId))) { dup++; continue; }
    db.expenses.push(item);
    seen.add(String(item.extId));
    added++;
  }
  if (added) save();
  render();
  if (added) toast(`已导入 ${added} 笔微信账单${dup ? `，跳过 ${dup} 笔重复` : ''}`);
  else if (dup) toast('这些账单之前已经导入过');
  else toast('没有识别到可导入的支出');
  return { added, dup };
}

function readTextFileSmart(file, done) {
  if (file.size > 50 * 1024 * 1024) { toast('文件太大，请选择微信导出的 CSV 账单'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    let text = new TextDecoder('utf-8').decode(reader.result);
    if (text.includes('�')) {
      try { text = new TextDecoder('gb18030').decode(reader.result); } catch (e) { /* keep utf-8 */ }
    }
    done(text, file.name);
  };
  reader.onerror = () => toast('读取文件失败，请再试一次');
  reader.readAsArrayBuffer(file);
}

  openSheet({
    title: '导入微信账单',

    body: `
      ${field('选择账单文件', `<input class="input" type="file" id="wechat-file" accept=".csv,.txt,text/csv,text/plain">
        <div class="hint">微信「账单下载 → 用于个人对账」得到的 CSV。压缩包解压后选择其中的 CSV 文件。</div>`)}
      <div id="wechat-preview" class="form-note">还没有选择文件</div>
      <div class="divider"></div>

      <ol class="watch-steps">
        <li>微信 → 我 → 服务 → 钱包 → 账单</li>

      <div class="form-note mt8">只导入「支出」。转账、红包、提现、还款、退款不会计入消费。文件只在本机解析，不会上传；重复导入按交易单号自动去重。</div>
    `,
    afterMount(form) {
      const input = form.querySelector('#wechat-file');
      const preview = form.querySelector('#wechat-preview');
      form.__wechatParsed = null;
      input.addEventListener('change', () => {
        const f = input.files && input.files[0];
        if (!f) return;
        form.__wechatParsed = null;
        preview.textContent = '正在解析…';
        readTextFileSmart(f, (text) => {
          try {
            const parsed = parseWechatText(text);
            form.__wechatParsed = parsed;
            if (parsed.items.length) {
              const total = parsed.items.reduce((a, b) => a + b.amount, 0);
              const dates = parsed.items.map((x) => x.date).sort();
              const skipped = [];
              if (parsed.income) skipped.push(`${parsed.income} 笔收入`);
              if (parsed.refunds) skipped.push(`${parsed.refunds} 笔退款`);
              if (parsed.transfers) skipped.push(`${parsed.transfers} 笔转账/红包/还款`);
              preview.innerHTML = `识别到 <b>${parsed.items.length}</b> 笔支出，合计 <b>${fmtMoney(total)}</b><br>范围：${dates[0]} → ${dates[dates.length - 1]}${skipped.length ? `<br>已跳过：${skipped.join('、')}` : ''}`;
            } else {
              preview.innerHTML = '没有识别到支出记录。请确认选择的是微信「用于个人对账」导出的 CSV 文件。';
            }
          } catch (err) {
            preview.textContent = '解析失败，请确认文件格式';
          }
        });
      });
    },
    onSubmit(form) {
      if (!form.__wechatParsed) { toast('先选择一个账单文件，等识别完成'); return false; }
      applyWechatImport(form.__wechatParsed);
    },
  });
}

      const currentActivity = () => actById(sel.value);
      const updateHint = () => {
        const a = currentActivity();
        hint.textContent = `MET ${a.met} · ${typeById(a.type).name}训练${a.dist ? ' · 可填写距离' : ''}`;
        distWrap.style.display = a.dist ? '' : 'none';
      };
      const calc = () => {
        const a = currentActivity();
        const w = Number(wIn.value) || latestWeight();
        const min = Number(minIn.value) || 0;
        const kcal = manual.checked ? (Number(kcalIn.value) || 0) : Math.round((a.met * w * min) / 60);
        kcalNote.innerHTML = `${ic('flame', 15)}<div>MET ${a.met} × ${w} kg × ${(min / 60).toFixed(2)} h ≈ <b>${kcal}</b> 千卡</div>`;
        return kcal;
      };
      const syncType = () => {
        const checked = form.querySelector('input[name="wtype"]:checked');
        const type = checked ? checked.value : 'strength';
        sel.innerHTML = activityOptions(type);
        strengthWrap.style.display = type === 'strength' ? '' : 'none';
        updateHint();
        calc();
      };
      typeWrap.addEventListener('change', syncType);
      sel.addEventListener('change', () => { updateHint(); calc(); });
      minIn.addEventListener('input', calc);
      wIn.addEventListener('input', calc);
      rpe.addEventListener('input', () => { rpeOut.textContent = rpe.value; });
      manual.addEventListener('change', () => {
        kcalIn.style.display = manual.checked ? '' : 'none';
        kcalIn.disabled = !manual.checked;
        if (manual.checked && !kcalIn.value) kcalIn.value = calc();
        calc();
      });
      kcalIn.addEventListener('input', calc);
      form.querySelector('#ex-add').addEventListener('click', () => {
        form.querySelector('#ex-list').insertAdjacentHTML('beforeend', exRowHtml());
      });
      form.querySelector('#ex-list').addEventListener('click', (e) => {
        const b = e.target.closest('[data-ex-del]');
        if (b) b.closest('.ex-row').remove();
      });
      updateHint();
      calc();
    },
    onSubmit(form, data) {
      const minutes = numberVal(data, 'minutes');
      if (!minutes || minutes <= 0) { toast('请填写训练时长'); return false; }
      const checked = form.querySelector('input[name="wtype"]:checked');
      const type = checked ? checked.value : 'strength';
      const act = actById(form.querySelector('#wk-act').value);
      const weight = numberVal(data, 'bodyweight') || latestWeight();
      const manual = form.querySelector('#manual-kcal').checked;
      const kcal = manual
        ? numberVal(data, 'kcal')
        : Math.round((act.met * weight * minutes) / 60);
      if (!kcal || kcal <= 0) { toast('请填写有效的热量值'); return false; }

      const exercises = [...form.querySelectorAll('.ex-row')].map((row) => ({
        name: row.querySelector('[name="exName"]').value.trim(),
        sets: Number(row.querySelector('[name="exSets"]').value) || 0,
        reps: Number(row.querySelector('[name="exReps"]').value) || 0,
        weight: Number(row.querySelector('[name="exWeight"]').value) || 0,
      })).filter((e) => e.name);

      const before = {};
      prs().forEach((p) => { before[p.name] = p.orm; });

      const rec = {
        id: uid(),
        date: data.get('date') || todayISO(),
        type,
        activity: act.id,
        activityName: act.name,
        met: act.met,
        minutes,
        bodyweight: weight,
        distance: act.dist ? (numberVal(data, 'distance') || '') : '',
        hr: numberVal(data, 'hr') || '',
        rpe: numberVal(data, 'rpe') || '',
        muscles: data.getAll('muscles'),
        exercises: type === 'strength' ? exercises : [],
        kcal,
        note: textVal(data, 'note'),
      };
      db.workouts.push(rec);
      const improved = prs().filter((p) => p.orm > (before[p.name] || 0) + 0.01).slice(0, 2);
      save(); render();
      if (improved.length) {
        toast('训练已记录 · 新纪录：' + improved.map((p) => `${p.name} ${Math.round(p.orm * 10) / 10}kg`).join('、'));
      } else {
        toast(`已记录 · 消耗 ${fmtKcal(kcal)} 千卡`);
      }
    },
  });
}
